name: FLVY Android
on:
  push: { branches: [ main ] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - run: gradle --no-daemon :app:assembleRelease
      - name: Create test signing key
        run: keytool -genkeypair -v -keystore flvy-test.keystore -storepass flvytest -keypass flvytest -alias flvy-test -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FLVY Test, OU=FLVY, O=FLVY, L=Hyderabad, ST=Telangana, C=IN"
      - name: Sign and verify
        run: |
          $ANDROID_HOME/build-tools/35.0.0/zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-release-aligned.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign --ks flvy-test.keystore --ks-pass pass:flvytest --key-pass pass:flvytest --out FLVY-0.1.0-test-signed.apk app-release-aligned.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose FLVY-0.1.0-test-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FLVY-0.1.0-test-signed
          path: FLVY-0.1.0-test-signed.apk
          retention-days: 14
